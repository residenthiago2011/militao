<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="DSH Tool Router cover">
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#161238"/>
    </linearGradient>
    <linearGradient id="cardline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#cardbg)"/>
  <circle cx="1010" cy="120" r="260" fill="#6ea8fe" opacity="0.06"/>
  <circle cx="140" cy="700" r="240" fill="#5eead4" opacity="0.05"/>

  <text x="90" y="150" fill="#8b96b8" font-family="Verdana,sans-serif" font-size="22" letter-spacing="8">DSH TOOL ROUTER</text>
  <text x="90" y="250" fill="#dbe4ff" font-family="Verdana,sans-serif" font-size="64" font-weight="bold">One tool.</text>
  <text x="90" y="330" fill="#5eead4" font-family="Verdana,sans-serif" font-size="64" font-weight="bold">On demand.</text>
  <text x="90" y="410" fill="#8b96b8" font-family="Verdana,sans-serif" font-size="24">Lazy tool discovery for DeepSeek Harness.</text>

  <rect x="90" y="490" width="520" height="150" rx="18" fill="#0f1528" stroke="#26304f" stroke-width="2"/>
  <g font-family="Consolas,Menlo,monospace" font-size="24">
    <text x="120" y="544" fill="#6ea8fe">$</text>
    <text x="152" y="544" fill="#dbe4ff">find_tool("read a file")</text>
    <text x="120" y="590" fill="#5eead4">&#8594; read</text>
    <text x="230" y="590" fill="#fbbf24">conf 0.816</text>
    <text x="120" y="622" fill="#8b96b8">revealed 1 of 25 schemas</text>
  </g>

  <rect x="660" y="490" width="450" height="150" rx="18" fill="#10282a" stroke="#2a5a55" stroke-width="2"/>
  <text x="700" y="552" fill="#5eead4" font-family="Verdana,sans-serif" font-size="40" font-weight="bold">96%</text>
  <text x="700" y="592" fill="#a9e8dc" font-family="Verdana,sans-serif" font-size="20">smaller prefill</text>
  <text x="700" y="620" fill="#8b96b8" font-family="Verdana,sans-serif" font-size="17">6,559 &#8594; 283 tokens</text>

  <rect x="90" y="700" width="1020" height="6" rx="3" fill="url(#cardline)" opacity="0.6"/>
</svg>
